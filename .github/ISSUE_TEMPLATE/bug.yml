name: Report a bug
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plume version
      description: Shown at the bottom of Settings.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: "MacBook Air M2, macOS 15.4"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The last lines of `~/Library/Logs/Plume/plume.log` and the output of `plume doctor`. Read them before sending, they can contain excerpts of your dictations.
      render: text
