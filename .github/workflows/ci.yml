# Compile Plume et lance les tests à chaque push et à chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Compiler
        run: swift build -c release
      - name: Tests
        # Réglages, dossiers et canal à part, comme scripts/test.sh.
        env:
          PLUME_DEFAULTS: tests
          PLUME_CHANNEL: tests
          PLUME_SUPPORT: ${{ runner.temp }}/plume-support
          PLUME_LIBRARY: ${{ runner.temp }}/plume-library
        run: swift test
